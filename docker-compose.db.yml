services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: formunauts
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d formunauts"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - formunauts

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - formunauts

volumes:
  pg_data:

networks:
  formunauts:
    external: true
