<app-table
  [columns]="columns()"
  [sortParams]="sortParams()"
  [isEmpty]="donations().length === 0"
  [emptyMessage]="'donationTable.empty' | transloco"
  [ariaLabel]="'donationTable.ariaLabel' | transloco"
  (sortChange)="onSort($event)"
>
  @for (d of donations(); track d.id) {
    <tr [class.is-mock]="d.isMock">
      <td>{{ d.donor.firstName }} {{ d.donor.lastName }}</td>
      <td>{{ d.donor.email ?? '—' }}</td>
      <td class="channel">{{ d.channel.replace('_', ' ') }}</td>
      <td>{{ d.amount | currency:'EUR':'symbol':'1.2-2' }}</td>
      <td class="method">{{ d.paymentMethod.replace(/_/g, ' ') }}</td>
      <td>{{ d.createdAt | date:'mediumDate' }}</td>
    </tr>
  }
</app-table>
